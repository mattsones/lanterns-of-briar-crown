name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Asset audit
        run: npm run audit:assets -- --limit=10

      - name: Rules
        run: npm run test:rules

      - name: Chapter 1 golden path
        run: npm run playtest:chapter1

      - name: Chapter 2 golden paths
        run: npm run playtest:chapter2

      - name: Chapter 3 golden paths
        run: npm run playtest:chapter3

      - name: Smoke playtest
        run: npm run playtest:smoke
